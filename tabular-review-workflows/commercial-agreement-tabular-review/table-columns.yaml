$schema: ../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Taraflar
  format: bulleted_list
  prompt: Sözleşmenin bütün taraflarını belirle. Her taraf için tam ticaret unvanını, varsa MERSİS ya da vergi numarasını ve sözleşmedeki sıfatını (ör. satıcı, alıcı, hizmet sağlayan, lisans veren) yaz.
- index: 1
  name: Kapsam
  format: text
  prompt: Sözleşme kapsamında sağlanacak iş, hizmet ya da malları özetle. Temel teslim edilecekleri ve yükümlülükleri, kapsam sınırlamalarını ve istisnaları belirt.
- index: 2
  name: Önceki sözleşmeyle ilişkisi
  format: text
  prompt: Bu sözleşme önceki bir sözleşmeyi değiştiriyor, yeniden düzenliyor, tamamlıyor ya da onun yerini alıyor mu? Evetse önceki sözleşmeyi adı ve tarihiyle belirt.
- index: 3
  name: Yürürlük tarihi
  format: date
  prompt: Sözleşmenin yürürlük ya da başlangıç tarihi nedir? Açık bir tarih yoksa ne zaman yürürlüğe girmiş sayıldığını belirt.
- index: 4
  name: Süre
  format: text
  prompt: Sözleşmenin süresi nedir? İlk süreyi ve süreyi etkileyen koşulları belirt.
- index: 5
  name: Yenileme
  format: text
  prompt: Hangi yenileme hükümleri uygulanır? Yenilemenin kendiliğinden mi bildirimle mi olduğunu, yenileme süresini ve kendiliğinden yenilemeyi önlemek için gereken bildirim sürelerini belirt.
- index: 6
  name: Bedel ve ödeme
  format: text
  prompt: Bedel yapısı nedir? Bütün ücretleri, oranları, ödeme koşullarını, para birimini, KDV'nin dahil olup olmadığını, ödeme takvimini ve faturalama şartlarını belirt.
- index: 7
  name: Fiyat ayarlaması
  format: text
  prompt: Fiyat ayarlama mekanizması var mı? TÜFE/ÜFE endekslemesi, kur farkı, hacme bağlı indirim ya da diğer ayarlama hükümlerini belirt.
- index: 8
  name: Geç ödemenin sonuçları
  format: text
  prompt: Geç ödemede hangi sonuçlar uygulanır? Temerrüt faizi oranını, ifadan kaçınma ya da hizmeti durdurma hakkını ve diğer çareleri belirt.
- index: 9
  name: Tahmini sözleşme değeri
  format: text
  prompt: Sözleşmenin toplam tahmini ya da belirtilen değeri nedir? Tek bir tutar yoksa belirtilen oranlar ve süreye göre hesapla ya da tahmin et; para birimini ve varsayımlarını yaz.
- index: 10
  name: Sorumluluk sınırı
  format: text
  prompt: Hangi sorumluluk sınırlamaları uygulanır? Üst sınırları ve nasıl hesaplandığını, dolaylı zarar istisnalarını ve sınırın dışında tutulan hâlleri belirt. Kast ve ağır kusurdan sorumsuzluk kaydı varsa TBK md. 115 bakımından not düş.
- index: 11
  name: Fikrî mülkiyet
  format: text
  prompt: Fikrî mülkiyet hakları nasıl düzenlenmiş? Önceden var olan ve yeni oluşturulan eserlerin kime ait olduğunu ve verilen lisansları belirt. Mali hakların FSEK'in aradığı gibi yazılı ve tek tek sayılarak devredilip devredilmediğini not et.
- index: 12
  name: Kontrol değişikliği
  format: text
  prompt: Kontrol değişikliği hükmü var mı? Neyin kontrol değişikliği sayıldığını, onay gerekip gerekmediğini ve doğan hakları (ör. fesih) belirt.
- index: 13
  name: Mücbir sebep
  format: text
  prompt: Mücbir sebep hükmünü özetle. Hangi olayların sayıldığını, hangi yükümlülüklerin askıya alındığını, fesih için olayın ne kadar sürmesi gerektiğini ve bildirim şartlarını belirt.
- index: 14
  name: Fesih hakları
  format: text
  prompt: Her tarafın fesih hakları nelerdir? Bildirimle (sebepsiz) feshi ve bildirim süresini, haklı nedenle feshi ve süre verme şartını, diğer fesih sebeplerini belirt.
- index: 15
  name: Cezai şart
  format: text
  prompt: Cezai şart var mı? Neyle tetiklendiğini, oranı ya da formülü, toplam üst sınırı ve cezanın ifa ile ilişkisini (seçimlik mi, ifayla birlikte mi) belirt (TBK md. 179-182). Borçlu tacir ise TTK md. 22 bakımından not düş.
- index: 16
  name: Uygulanacak hukuk
  format: text
  prompt: Sözleşmeye hangi hukuk uygulanır? Belirtilen ülke hukukunu yaz.
- index: 17
  name: Uyuşmazlık çözümü
  format: text
  prompt: Uyuşmazlıklar nasıl çözülür? Mahkeme ya da tahkim seçimini, yetkili mahkemeyi ya da tahkim yerini, varsa müzakere ve arabuluculuk aşamalarını belirt. Yetki şartının HMK md. 17, tahkim şartının HMK md. 412 bakımından geçerliliğini not et.
