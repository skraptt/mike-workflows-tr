$schema: ../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Kiraya veren
  format: text
  prompt: Kiraya veren kimdir? Tam adını ya da ticaret unvanını, varsa MERSİS ya da vergi numarasını ve adresini yaz.
- index: 1
  name: Kiracı
  format: text
  prompt: Kiracı kimdir? Tam adını ya da ticaret unvanını, varsa MERSİS ya da vergi numarasını ve adresini yaz.
- index: 2
  name: Kefil
  format: text
  prompt: Kefil var mı? Varsa adını, kefaletin türünü (adi ya da müteselsil) ve üst sınırını yaz. Kefalet sözleşmesinin azami miktar ve el yazısı şartlarını (TBK md. 583) karşılayıp karşılamadığını not et.
- index: 3
  name: Kiralanan
  format: text
  prompt: 'Kiralananı tarif et: adres, kat, bağımsız bölüm, tapu bilgisi, alan ve kiralanana dahil olan ya da olmayan eklentiler.'
- index: 4
  name: Sözleşme tarihi
  format: date
  prompt: Kira sözleşmesinin tarihi nedir? İmza tarihi ile kira başlangıç tarihi farklıysa ikisini de yaz.
- index: 5
  name: Süre
  format: text
  prompt: Sözleşme süresi nedir? Süreyi, başlangıç ve bitiş tarihlerini yaz. Kiracı bildirimde bulunmazsa sözleşmenin bir yıl uzayacağını (TBK md. 347) dikkate al.
- index: 6
  name: Kira bedeli
  format: monetary_amount
  prompt: Başlangıç kira bedeli nedir? Tutarı, para birimini, aylık ya da yıllık olduğunu, ödeme zamanını ve KDV ile stopajın nasıl düzenlendiğini yaz.
- index: 7
  name: Kira artışı
  format: text
  prompt: Kira artışı nasıl belirlenir? Artış oranını ve dönemini yaz. Yenilenen dönemlerde artışın TÜFE on iki aylık ortalamasını aşıp aşmadığını (TBK md. 344) not et.
- index: 8
  name: Yan giderler ve aidat
  format: text
  prompt: Kiracı hangi yan giderleri ve aidatları öder? Kapsamı ve paylaşım oranını yaz. Kira ve yan gider dışında ödeme yükümlülüğü getirilmiş mi (TBK md. 346)?
- index: 9
  name: Sigorta
  format: text
  prompt: Sigorta yükümlülükleri nelerdir? Kimin sigorta yaptıracağını, hangi risklerin sigortalanacağını ve primin kim tarafından ödeneceğini yaz.
- index: 10
  name: Kullanım amacı
  format: text
  prompt: Kiralananın kullanım amacı nedir? İzin verilen faaliyeti ve kısıtlamaları yaz; ruhsat ve izinlerin kimin sorumluluğunda olduğunu belirt.
- index: 11
  name: Bakım ve onarım
  format: text
  prompt: Bakım ve onarımdan kim sorumludur? Olağan bakım ile esaslı onarımları ayırarak kiracının ve kiraya verenin yükümlülüklerini yaz.
- index: 12
  name: Tadilat
  format: text
  prompt: Kiracı hangi tadilatları yapabilir? Esaslı ve basit tadilatları ayır; kiraya verenin izni gerekip gerekmediğini ve sözleşme sonunda eski hâle getirme yükümlülüğünü yaz.
- index: 13
  name: Devir ve alt kira
  format: text
  prompt: Kiracının kira ilişkisini devretme ve alt kiraya verme hakları nelerdir? Kiraya verenin yazılı rızası gerekiyor mu? İşyerinde kiraya verenin haklı sebep olmadıkça rızadan kaçınamayacağını (TBK md. 323) dikkate al.
- index: 14
  name: Erken fesih hakları
  format: text
  prompt: Erken fesih hakkı var mı? Kimin elinde olduğunu, fesih tarihini, bildirim süresini ve koşullarını yaz.
- index: 15
  name: Kanuni koruma
  format: text
  prompt: Sözleşme konut ve çatılı işyeri kiralarına ilişkin koruyucu hükümlere (TBK md. 339 vd.) tabi mi? Tabi değilse nedenini (ör. çatısız işyeri, kısa süreli kullanım) yaz.
- index: 16
  name: Tahliye taahhüdü
  format: text
  prompt: Tahliye taahhüdü var mı? Tarihini, kiralananın tesliminden sonra mı alındığını ve boşaltma tarihini yaz (TBK md. 352/1).
- index: 17
  name: Güvence
  format: text
  prompt: Güvence (depozito) istenmiş mi? Tutarını, saklanma biçimini ve iade koşullarını yaz. Üç aylık kirayı aşıp aşmadığını ve vadeli hesaba yatırılıp yatırılmadığını (TBK md. 342) not et.
- index: 18
  name: Temerrüt ve fesih
  format: text
  prompt: Kiraya verenin temerrüt ve fesih hakları nelerdir? Kiranın ödenmemesinde verilecek süreyi (TBK md. 315, çatılı işyerinde en az otuz gün), iki haklı ihtar sebebiyle tahliyeyi (TBK md. 352/2) ve sözleşmedeki diğer fesih sebeplerini yaz. Kira borcuna bağlanmış cezai şart ya da muacceliyet kaydı varsa not et.
- index: 19
  name: Uygulanacak hukuk ve yetki
  format: text
  prompt: Sözleşmeye hangi hukuk uygulanır ve uyuşmazlıklarda hangi mahkeme ile icra dairesi yetkilidir?
