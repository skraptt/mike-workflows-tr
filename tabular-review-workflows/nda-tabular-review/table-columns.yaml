$schema: ../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Yön
  format: text
  prompt: Sözleşme karşılıklı mı (iki taraf da birbirine gizlilik borcu altında) yoksa tek taraflı mı? Yönü belirt ve açıklayan ile alan tarafları yaz.
- index: 1
  name: Gizli bilginin tanımı
  format: text
  prompt: '''Gizli Bilgi'' nasıl tanımlanmış? Tanım geniş mi dar mı? Bilginin gizli olarak işaretlenmesi gerekiyor mu, yoksa amaçla bağlantılı paylaşılan her bilgi kapsamda mı? Açıkça dahil edilen ya da hariç tutulanları yaz.'
- index: 2
  name: Alan tarafın yükümlülükleri
  format: bulleted_list
  prompt: Alan tarafın gizli bilgiye ilişkin temel yükümlülüklerini listele (ör. gizli tutma, üçüncü kişilere açıklamama, yalnızca amaç için kullanma, belirli bir özen ölçüsü, bilmesi gereken kişilerle sınırlama).
- index: 3
  name: Standart istisnalar var mı?
  format: text
  prompt: 'Sözleşme standart istisnaları içeriyor mu? Şu bilgileri hariç tutuyorsa Evet yaz: (a) ihlal olmaksızın kamuya açık olan ya da açık hâle gelen, (b) alan tarafın önceden bildiği, (c) bağımsız olarak geliştirilen, (d) üçüncü kişiden kısıtlamasız alınan. Eksik ya da farklı yazılmış istisnaları not et.'
- index: 4
  name: İzin verilen açıklamalar
  format: bulleted_list
  prompt: Alan taraf gizli bilgiyi kimlere açıklayabilir? Her alıcı kategorisini listele (ör. çalışanlar, danışmanlar, bağlı şirketler, finansman sağlayanlar, düzenleyici kurumlar) ve alıcıların eşdeğer yükümlülüklerle bağlanması gerekip gerekmediğini yaz.
- index: 5
  name: Süre
  format: text
  prompt: Sözleşmenin süresi nedir ve gizlilik yükümlülükleri ne kadar devam eder? Sözleşme süresini ve yükümlülüklerin sona ermeden sonra ne kadar sürdüğünü yaz.
- index: 6
  name: İade ve imha
  format: text
  prompt: Süre bitiminde ya da fesihte gizli bilginin iadesi veya imhası için hangi yükümlülükler var? İade ile imha arasında seçim var mı, imhanın belgelenmesi gerekiyor mu, saklama istisnaları (ör. yasal saklama, yedekler) var mı?
- index: 7
  name: Cezai şart ve çareler
  format: text
  prompt: İhlal hâlinde hangi çareler var? Cezai şartı, tutarını ve ifa ile ilişkisini (TBK md. 179-182), ayrıca tazminat istenip istenemeyeceğini ve ihtiyati tedbir imkânını yaz.
- index: 8
  name: Uygulanacak hukuk ve yetki
  format: text
  prompt: Sözleşmeye hangi hukuk uygulanır ve hangi mahkemeler yetkilidir? Yetkinin münhasır olup olmadığını ve tahkim şartını yaz.
