$schema: ../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: İşveren
  format: text
  prompt: İşveren kimdir? Tam ticaret unvanını ve varsa SGK işyeri sicil numarasını yaz.
- index: 1
  name: İşçi
  format: text
  prompt: İşçi kimdir? Adını soyadını ve belirtilmişse adresini ya da çalışacağı yeri yaz.
- index: 2
  name: Tarih
  format: date
  prompt: İş sözleşmesinin tarihi nedir? İşe başlama tarihi imza tarihinden farklıysa ikisini de yaz.
- index: 3
  name: Görev
  format: text
  prompt: İşçinin unvanı ya da görevi nedir? Bağlı olduğu yönetici belirtilmişse ekle.
- index: 4
  name: Ücret
  format: text
  prompt: İşçinin ücreti nedir? Brüt ya da net olduğunu, para birimini, ödeme dönemini ve prim ile ikramiyeleri yaz.
- index: 5
  name: Sözleşme türü
  format: text
  prompt: Sözleşme belirli süreli mi belirsiz süreli mi, tam süreli mi kısmi süreli mi? Kısmi süreliyse haftalık süreyi, belirli süreliyse süreyi ve objektif gerekçeyi yaz.
- index: 6
  name: İşçi mi, serbest çalışan mı?
  format: text
  prompt: Sözleşme çalışanı işçi yerine serbest çalışan, danışman ya da hizmet sağlayıcı olarak mı nitelendiriyor? Nitelendirmeyi ve bağımlılık unsurunu gösteren hükümleri yaz (TBK md. 393).
- index: 7
  name: Yan haklar
  format: bulleted_list
  prompt: İşçinin yararlandığı yan hakları listele (ör. özel sağlık sigortası, bireysel emeklilik katkısı, yemek, yol, araç).
- index: 8
  name: İhbar süresi (işveren)
  format: text
  prompt: İşverenin sözleşmeyi bildirimle feshederken uyması gereken ihbar süresi nedir? İhbar süresine ait ücretin peşin ödenmesine ilişkin hükümleri yaz (İş Kanunu md. 17, doğrulanmamış).
- index: 9
  name: İhbar süresi (işçi)
  format: text
  prompt: İşçinin istifa ederken uyması gereken ihbar süresi nedir?
- index: 10
  name: Fazla çalışma
  format: text
  prompt: Fazla çalışma nasıl düzenlenmiş? Fazla çalışma ücretinin oranını ya da ücrete dahil sayılıp sayılmadığını ve bunun sınırını yaz.
- index: 11
  name: Çalışma süresi
  format: text
  prompt: Haftalık çalışma süresi, günlük çalışma saatleri, esneklik ve uzaktan çalışma hükümleri nelerdir?
- index: 12
  name: Çalışma koşullarında değişiklik
  format: text
  prompt: İşveren çalışma koşullarını tek taraflı değiştirebilir mi, yoksa işçinin yazılı onayı mı gerekir? Görev ve yer değişikliği yetkisini yaz.
- index: 13
  name: Fikrî mülkiyet
  format: text
  prompt: İşçinin iş sırasında meydana getirdiği eserler ve buluşlar kime ait? Hakların devrine ilişkin hükümleri yaz.
- index: 14
  name: Rekabet yasağı
  format: text
  prompt: Rekabet yasağı var mı? Süresini, coğrafi kapsamını, yasaklanan işleri, karşılık ödenip ödenmediğini ve cezai şartı yaz. İki yılı aşıp aşmadığını (TBK md. 445) ve yalnızca işçi aleyhine cezai şart olup olmadığını (TBK md. 420) not et.
- index: 15
  name: Haklı nedenle fesih
  format: bulleted_list
  prompt: Sözleşmede haklı nedenle (bildirimsiz) fesih sebepleri olarak sayılan hâlleri listele.
- index: 16
  name: Yıllık izin
  format: text
  prompt: Yıllık ücretli izin süresi nedir? Kanuni asgarinin üzerinde bir süre tanınıp tanınmadığını yaz (İş Kanunu md. 53, doğrulanmamış).
